<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>O</title>
  <link rel="stylesheet" href="liquid.css">
  <link rel="stylesheet" href="island.css">
</head>
<body>

  <div id="stage">
    <!-- Filtered layer: opaque blobs; the goo filter joins and separates them. -->
    <div class="ol-goo" id="goo" aria-hidden="true">
      <div class="ol-blob g-cap g-cap-l"></div>
      <div class="ol-blob g-mid"></div>
      <div class="ol-blob g-cap g-cap-r"></div>
      <div class="ol-blob g-bar"></div>
      <div class="ol-blob g-side"></div>
    </div>

    <!-- Island: the slim status capsule. -->
    <button id="island" type="button" aria-label="O status. Open the command bar">
      <span class="rim rim-l" aria-hidden="true"></span>
      <span class="rim rim-m" aria-hidden="true"></span>
      <span class="rim rim-r" aria-hidden="true"></span>
      <span class="island-row" id="island-row">
        <span class="ring" id="ring" aria-hidden="true">
          <span class="ring-halo"></span>
          <svg viewBox="0 0 14 14" width="14" height="14">
            <circle class="ring-base" cx="7" cy="7" r="5.25"/>
            <circle class="ring-arc" cx="7" cy="7" r="5.25"/>
          </svg>
        </span>
        <span class="line" id="line" aria-live="polite"></span>
        <span class="meta" id="meta"></span>
      </span>
    </button>

    <!-- Command bar. -->
    <div id="bar" role="search">
      <span class="bar-rim ol-glass" aria-hidden="true"></span>
      <span class="bar-ring" aria-hidden="true">
        <svg viewBox="0 0 14 14" width="16" height="16"><circle cx="7" cy="7" r="5.25"/></svg>
      </span>
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Give O a goal or a task…" aria-label="Give O a goal or a task" aria-controls="bubbles">
      <span class="keys" aria-hidden="true"><span class="kg kg-run"><kbd>↵</kbd>Run</span><span class="kg"><kbd id="mod-key">⌘↵</kbd>Panel</span></span>
    </div>
    <button id="side" type="button" aria-label="Open the full panel" title="Open the full panel">
      <span class="side-rim ol-glass" aria-hidden="true"></span>
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="3"/><path d="M12 4v12"/></svg>
    </button>

    <div id="bubbles" role="listbox" aria-label="Suggestions, tasks and approvals"></div>
  </div>

  <span id="measure" aria-hidden="true"></span>
  <script src="liquid.js"></script>
  <script src="islandgeom.js"></script>
  <script src="app.js"></script>
</body>
</html>
