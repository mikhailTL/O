<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>O</title>
  <link rel="stylesheet" href="liquid.css">
  <link rel="stylesheet" href="island.css">
</head>
<body>

  <div id="stage">
    <!-- Filtered layer: opaque blobs; the goo filter joins and separates them (the circle and the input segment
         grow a liquid neck when they meet). -->
    <div class="ol-goo" id="goo" aria-hidden="true">
      <div class="ol-blob g-cap g-cap-l"></div>
      <div class="ol-blob g-mid"></div>
      <div class="ol-blob g-cap g-cap-r"></div>
      <div class="ol-blob g-seg"></div>
    </div>

    <!-- The O circle: the dot, the pill's capsule, the cluster's circle. -->
    <button id="island" type="button" aria-label="O status. Click to type a task">
      <span class="rim rim-l" aria-hidden="true"></span>
      <span class="rim rim-m" aria-hidden="true"></span>
      <span class="rim rim-r" aria-hidden="true"></span>
      <span class="island-row" id="island-row">
        <span class="ring" id="ring" aria-hidden="true">
          <span class="ring-halo"></span>
          <svg viewBox="0 0 14 14" width="14" height="14">
            <circle class="ring-base" cx="7" cy="7" r="5.25"/>
            <circle class="ring-arc" cx="7" cy="7" r="5.25"/>
          </svg>
        </span>
        <span class="line" id="line" aria-live="polite"></span>
        <span class="meta" id="meta"></span>
      </span>
    </button>

    <!-- The expand circle (hover): the full dashboard. -->
    <button id="expand" type="button" aria-label="Open the full dashboard" title="Full dashboard (Ctrl+Shift+Space)">
      <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true"><path d="M11.5 4.5H15.5V8.5M8.5 15.5H4.5V11.5M15.5 4.5 11 9M4.5 15.5 9 11"/></svg>
    </button>

    <!-- The input segment: one short glass capsule beside the circle. -->
    <div id="seg" role="search">
      <span class="seg-rim ol-glass" aria-hidden="true"></span>
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Give O a task…" aria-label="Give O a task" aria-controls="chips">
      <span class="keys" aria-hidden="true"><kbd>↵</kbd></span>
    </div>

    <!-- Chips: one small capsule per task / approval, arranged around the circle. -->
    <div id="chips" role="list" aria-label="Tasks and approvals"></div>

    <!-- One result / approval card, anchored to its chip. -->
    <div id="card" class="ol-glass" role="dialog" aria-live="polite" hidden></div>
  </div>

  <span id="measure" aria-hidden="true"></span>
  <script src="liquid.js"></script>
  <script src="islandgeom.js"></script>
  <script src="adapt.js"></script>
  <script src="app.js"></script>
</body>
</html>
