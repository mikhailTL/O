<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- O: a black glass disc. Vertical glass gradient, hairline rim light, one thin luminous white ring
       (the letter O) with a soft white halo, and a small off-centre specular. Monochrome by design. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset=".55" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="disc"><circle cx="128" cy="128" r="118"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#body)"/>
  <ellipse cx="128" cy="52" rx="92" ry="34" fill="url(#sheen)" clip-path="url(#disc)"/>
  <circle cx="128" cy="128" r="117.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#ffffff" stroke-width="22" opacity=".28" filter="url(#halo)"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#ffffff" stroke-width="10" opacity=".32" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#ffffff" stroke-width="6" opacity=".96"/>
  <ellipse cx="100" cy="74" rx="18" ry="11" transform="rotate(-32 100 74)" fill="url(#spec)"/>
</svg>
