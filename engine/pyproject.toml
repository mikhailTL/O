[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-engine"
version = "1.0.0"
description = "O AI provisioning engine: strict schema, fixed DAG, logged execution, script cache, telemetry diagnostics."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "openai>=1.30",
  "playwright>=1.44",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
o-engine = "o_engine.cli:main"

[tool.setuptools.packages.find]
include = ["o_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
