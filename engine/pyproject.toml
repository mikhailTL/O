[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-engine"
version = "1.0.0"
description = "O AI provisioning engine: strict schema, fixed DAG, logged execution, script cache, telemetry diagnostics."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "openai>=1.30",
  "playwright>=1.44",
  "pillow>=10",
  "mcp>=2.0",
  "e2b>=1.0",
  "crewai>=0.100",
  "browser-use>=0.1.40",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Ambient sensing / autonomous infrastructure (plan J); the installer installs it by default.
ambient = [
  "mediapipe>=0.10",
  "opencv-python>=4.8",
  "sounddevice>=0.4",
  "paho-mqtt>=2.0",
  "redis>=5",
  "websockets>=12",
  "microsandbox>=0.1",
  "open-rppg>=0.1",
]

[project.scripts]
o-engine = "o_engine.cli:main"

[tool.setuptools.packages.find]
include = ["o_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
