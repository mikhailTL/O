[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-engine"
version = "1.0.0"
description = "O AI provisioning engine: strict schema, fixed DAG, logged execution, script cache, telemetry diagnostics."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "python-dateutil>=2.8,<3",  # botocore (pulled in by optional extras) requires <3
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "openai>=1.30",
  "playwright>=1.44",
  "pillow>=10",
  "mcp>=2.0",
  "e2b>=1.0",
  "crewai>=0.100",
  "browser-use>=0.1.40",
  "numpy>=1.26",
  # macOS computer use (o_engine/cu/backends/ax.py): the Accessibility API. atomacos 3.3.0 pulls pyobjc-core,
  # -Cocoa, -Quartz, -ApplicationServices, -CoreText and old pyautogui/pyscreeze/pygetwindow sdists (all build
  # on 3.12/3.13). The pyobjc frameworks are listed too: ax.py falls back to them directly (ax_pyobjc.py) if
  # atomacos does not import, and AXIsProcessTrusted() comes from ApplicationServices.
  "atomacos>=3.3; sys_platform == 'darwin'",
  "pyobjc-core>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  # Windows computer use (o_engine/cu/backends/uia.py, o_engine/tools/win_tools.py): UI Automation through
  # uiautomation (comtypes underneath), pixels through pyautogui, screenshots through mss, and pywin32 for the
  # Win32 pieces ctypes does not cover. The host desktop is the working display: no isolated display exists.
  "uiautomation>=2.0.18; sys_platform == 'win32'",
  "pyautogui>=0.9.54; sys_platform == 'win32'",
  "mss>=9.0; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Ambient sensing / autonomous infrastructure (plan J); the installer installs it by default.
# open-rppg 0.1.1 imports pkg_resources, which setuptools>=81 removed: hence the setuptools pin.
# OpenCV 5 dropped CascadeClassifier from opencv-python; the face finder then uses open-rppg's BlazeFace.
ambient = [
  "mediapipe>=0.10",
  "opencv-python>=4.8",
  "sounddevice>=0.4",
  "paho-mqtt>=2.0",
  "redis>=5",
  "websockets>=14",
  "microsandbox>=0.7.13",
  "open-rppg>=0.1.1",
  "setuptools<81",
]

[project.scripts]
o-engine = "o_engine.cli:main"

[tool.setuptools.packages.find]
include = ["o_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
